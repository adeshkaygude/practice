<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p class="text">HTML</p>
    <p class="text">CSS</p>
    <p class="text">JavaScript</p>
    <script>
      let all = document.getElementsByClassName("text");
      for (i of all) {
        i.style.background = "orange";
        i.textContent = "changed color";
      }
    </script>
  </body>
</html>
