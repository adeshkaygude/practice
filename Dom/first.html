<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1 id="title">dom selector</h1>

    <p class="message">hello</p>
    <p class="message">welcome</p>
    <p class="message">adesh</p>

    <div>div1</div>
    <div>div2</div>

    <script>
      // by id
      let title = document.getElementById("title");
      title.style.backgroundColor = "red";
      title.style.padding = "2px";

      // by using class name
      let message = document.getElementsByClassName("message");

      for (let i of message) {
        i.style.backgroundColor = "yellow";
      }

      // get element by tag name
      let divs = document.getElementsByTagName("div");

      for (let j of divs) {
        j.style.backgroundColor = "blue";
        j.style.padding = "5px";
        j.style.color = "red";
      }

      // query selector
      let query = document.querySelector("#title");
      query.style.color = "blue";

      // query selector all
      let all = document.querySelectorAll(".message");

      for (let i of all) {
        i.style.color = "red";
      }
    </script>
  </body>
</html>
