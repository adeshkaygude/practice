<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2 id="hi">hi hellow</h2>

    <p class="first">hi</p>
    <p class="first">hello</p>
    <p class="first">back</p>

    <div>1 div</div>
    <div>2 div</div>
    <script>
      // id selector
      let id = document.getElementById("hi");
      id.style.background = "red";

      // class selector

      let clas = document.getElementsByClassName("first");
      for (i of clas) {
        i.style.background = "pink";
      }

      // tag name selector

      let tag = document.getElementsByTagName("div");
      for (i of tag) {
        i.style.background = "yellow";
      }

      // query selector
      let query = document.querySelector(".first");
      query.style.color = "white";

      // query selector all

      let select = document.querySelectorAll(".first");
      for (j of select) {
        j.style.padding = "50px";
      }

      let change = document.querySelectorAll(".first");
      for (m of select) {
        m.innerHTML = "hi how are you ";
      }
    </script>
  </body>
</html>
